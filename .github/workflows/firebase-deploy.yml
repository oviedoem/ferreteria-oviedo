name: Deploy to Firebase Hosting

# DESHABILITADO: este workflow despliega sin Datos.json (3.6MB, .gitignore)
# borrando el catálogo de hosting en cada push. El deploy lo hace ACTUALIZAR_TODO.bat
# localmente desde E:\ferreteria-oviedo\ donde Datos.json sí existe.
# Para rehabilitar: cambiar 'workflow_dispatch' por 'push: branches: [main]'
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ferreteria-oviedo
